name: secure_chat
description: Two-person end-to-end encrypted chat app
publish_to: 'none'
version: 0.14.0+14

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_webrtc: ^1.2.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  record: ^6.0.0
  share_plus: ^13.3.1
  gal: ^2.3.2
  local_auth: ^3.0.2
  flutter_local_notifications: ^17.0.0
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  file_selector: ^1.0.3
  qr_flutter: ^4.1.0
  app_links: ^6.4.0
  quick_actions: ^1.0.7
  timezone: ^0.9.4
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  device_info_plus: ^13.3.0
  geolocator: ^13.0.2
