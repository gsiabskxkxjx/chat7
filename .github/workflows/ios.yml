name: Build iOS

# نسخة الآيفون: ملف بناء منفصل تماماً عن الأندرويد (يشتغل يدوي من تبويب Actions > Build iOS > Run workflow).
# - بدون أسرار Apple: يطلع ملف IPA غير موقّع (للتثبيت عبر Sideloadly أو AltStore بحساب Apple مجاني).
# - مع الأسرار الأربعة أدناه: يطلع IPA موقّع جاهز (TestFlight أو Ad-hoc حسب نوع البروفايل).
#
# الأسرار (Settings > Secrets and variables > Actions):
#   IOS_CERT_P12_BASE64            شهادة التوزيع .p12 بصيغة base64
#   IOS_CERT_PASSWORD              كلمة سر ملف الـ p12
#   IOS_PROVISION_PROFILE_BASE64   ملف .mobileprovision بصيغة base64 (لـ com.bainatna.chat)
#   IOS_TEAM_ID                    معرّف الفريق (10 خانات)
#   IOS_GOOGLE_SERVICE_INFO_BASE64 (اختياري) ملف GoogleService-Info.plist بصيغة base64، للإشعارات

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 80
    env:
      BUNDLE_ID: com.bainatna.chat
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Tools
        run: |
          xcodebuild -version
          flutter --version
          pod --version

      - name: Generate iOS folder
        run: |
          flutter create --platforms=ios --org com.bainatna --project-name secure_chat .
          ls ios
          # نفس معرّف الأندرويد (com.bainatna.chat)
          python3 - <<'PY'
          import re
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          s = open(p, encoding='utf-8').read()
          s = s.replace('com.bainatna.secureChat', 'com.bainatna.chat')
          s = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('bundle ids:', sorted(set(re.findall(r'PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);', s))))
          p = 'ios/Podfile'
          s = open(p, encoding='utf-8').read()
          s, n = re.subn(r"(?m)^\s*#?\s*platform :ios.*$", "platform :ios, '15.0'", s, count=1)
          if n != 1:
              raise SystemExit('ERROR: platform line not found in Podfile')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Info.plist (name, permissions, invite links, background modes)
        run: |
          python3 - <<'PY'
          import plistlib
          p = 'ios/Runner/Info.plist'
          d = plistlib.load(open(p, 'rb'))
          d['CFBundleDisplayName'] = 'بيناتنا'
          d['CFBundleName'] = 'Bainatna'
          d['NSCameraUsageDescription'] = 'نحتاج الكاميرا لتصوير الصور والفيديو ومكالمات الفيديو.'
          d['NSMicrophoneUsageDescription'] = 'نحتاج المايك للمكالمات والرسائل الصوتية.'
          d['NSPhotoLibraryUsageDescription'] = 'لاختيار الصور والفيديوهات اللي تريد ترسلها.'
          d['NSPhotoLibraryAddUsageDescription'] = 'لحفظ الصور والفيديوهات بمعرض جوالك.'
          d['NSLocationWhenInUseUsageDescription'] = 'لمشاركة موقعك مع شريكك لما تختار تشاركه.'
          d['NSFaceIDUsageDescription'] = 'لقفل التطبيق ببصمة الوجه.'
          d['NSLocalNetworkUsageDescription'] = 'لتحسين جودة المكالمات.'
          d['UIBackgroundModes'] = ['remote-notification', 'audio']
          # روابط الدعوة bainatna://join?c=XXXXXX
          d['CFBundleURLTypes'] = [{
              'CFBundleURLName': 'com.bainatna.chat',
              'CFBundleURLSchemes': ['bainatna'],
          }]
          plistlib.dump(d, open(p, 'wb'))
          print(sorted(d.keys()))
          PY

      - name: Firebase config (iOS, optional)
        env:
          PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_BASE64 }}
        run: |
          if [ -z "$PLIST_B64" ]; then
            echo "No GoogleService-Info.plist secret: the app builds without push notifications on iOS."
            exit 0
          fi
          echo "$PLIST_B64" | base64 -D > ios/Runner/GoogleService-Info.plist
          python3 - <<'PY'
          import plistlib
          d = plistlib.load(open('ios/Runner/GoogleService-Info.plist', 'rb'))
          print('plist OK, bundle id =', d.get('BUNDLE_ID'))
          if d.get('BUNDLE_ID') != 'com.bainatna.chat':
              raise SystemExit('ERROR: GoogleService-Info.plist is for a different bundle id')
          PY
          # يضيف الملف لمشروع Xcode (ريسورس)
          python3 - <<'PY'
          import re, uuid
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          s = open(p, encoding='utf-8').read()
          if 'GoogleService-Info.plist' in s:
              raise SystemExit(0)
          ref = uuid.uuid4().hex[:24].upper()
          bld = uuid.uuid4().hex[:24].upper()
          s = s.replace('/* Begin PBXBuildFile section */',
              '/* Begin PBXBuildFile section */\n\t\t%s /* GoogleService-Info.plist in Resources */ = {isa = PBXBuildFile; fileRef = %s /* GoogleService-Info.plist */; };' % (bld, ref), 1)
          s = s.replace('/* Begin PBXFileReference section */',
              '/* Begin PBXFileReference section */\n\t\t%s /* GoogleService-Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; name = "GoogleService-Info.plist"; path = Runner/GoogleService-Info.plist; sourceTree = SOURCE_ROOT; };' % ref, 1)
          m = re.search(r'(/\* Runner \*/ = \{\s*isa = PBXGroup;\s*children = \()', s)
          if not m:
              raise SystemExit('ERROR: Runner group not found')
          s = s[:m.end()] + '\n\t\t\t\t%s /* GoogleService-Info.plist */,' % ref + s[m.end():]
          m = re.search(r'(/\* Resources \*/ = \{\s*isa = PBXResourcesBuildPhase;[^}]*?files = \()', s)
          if not m:
              raise SystemExit('ERROR: Resources phase not found')
          s = s[:m.end()] + '\n\t\t\t\t%s /* GoogleService-Info.plist in Resources */,' % bld + s[m.end():]
          open(p, 'w', encoding='utf-8').write(s)
          print('GoogleService-Info.plist added to the Runner target')
          PY

      - name: Detect signing secrets
        id: sign
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROF: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$PW" ] && [ -n "$PROF" ] && [ -n "$TEAM" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets found: building a SIGNED ipa"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets: building an UNSIGNED ipa (sideload with Sideloadly/AltStore)"
          fi

      - name: Dependencies
        run: flutter pub get

      # ---------------- مسار التوقيع (يشتغل فقط لو الأسرار موجودة) ----------------
      - name: Install certificate and provisioning profile
        if: steps.sign.outputs.signed == 'true'
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROF: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(uuidgen)"
          echo "$P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -E "Apple Distribution|iPhone Distribution|Apple Development|iPhone Developer" | head -n 1 | sed -E 's/^[^"]*"([^"]+)".*$/\1/')
          if [ -z "$IDENTITY" ]; then echo "ERROR: no signing identity found in the p12"; exit 1; fi
          echo "Identity: $IDENTITY"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROF" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os, plistlib
          d = plistlib.load(open(os.environ['RUNNER_TEMP'] + '/profile.plist', 'rb'))
          ent = d.get('Entitlements', {})
          appid = ent.get('application-identifier', '')
          bundle = appid.split('.', 1)[1] if '.' in appid else ''
          if d.get('ProvisionsAllDevices'):
              method = 'enterprise'
          elif ent.get('get-task-allow'):
              method = 'development'
          elif d.get('ProvisionedDevices'):
              method = 'ad-hoc'
          else:
              method = 'app-store'
          print('PROFILE_NAME=' + d['Name'])
          print('PROFILE_UUID=' + d['UUID'])
          print('PROFILE_TEAM=' + d['TeamIdentifier'][0])
          print('PROFILE_BUNDLE=' + bundle)
          print('EXPORT_METHOD=' + method)
          print('APS_ENV=' + str(ent.get('aps-environment', '')))
          PY
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$(grep PROFILE_UUID "$GITHUB_ENV" | cut -d= -f2).mobileprovision"

      - name: Configure manual signing in the Runner target only
        if: steps.sign.outputs.signed == 'true'
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          echo "Profile: $PROFILE_NAME ($EXPORT_METHOD), bundle: $PROFILE_BUNDLE, team: $PROFILE_TEAM, aps: $APS_ENV"
          if [ "$PROFILE_BUNDLE" != "$BUNDLE_ID" ] && [ "$PROFILE_BUNDLE" != "*" ]; then
            echo "ERROR: the provisioning profile is for '$PROFILE_BUNDLE' but the app is '$BUNDLE_ID'"; exit 1
          fi
          if [ "$PROFILE_TEAM" != "$TEAM" ]; then
            echo "ERROR: IOS_TEAM_ID does not match the profile team ($PROFILE_TEAM)"; exit 1
          fi
          # ملف الصلاحيات: الإشعارات تحتاج aps-environment لو البروفايل فيه
          python3 - <<'PY'
          import os, re, plistlib
          ent = {}
          if os.environ.get('APS_ENV'):
              ent['aps-environment'] = os.environ['APS_ENV']
          plistlib.dump(ent, open('ios/Runner/Runner.entitlements', 'wb'))
          p = 'ios/Runner.xcodeproj/project.pbxproj'
          s = open(p, encoding='utf-8').read()
          def patch(m):
              b = m.group(0)
              if 'INFOPLIST_FILE = Runner/Info.plist;' not in b:
                  return b
              b = re.sub(r'\s*CODE_SIGN_STYLE = [^;]+;', '', b)
              b = re.sub(r'\s*DEVELOPMENT_TEAM = [^;]+;', '', b)
              b = re.sub(r'\s*PROVISIONING_PROFILE_SPECIFIER = [^;]+;', '', b)
              b = re.sub(r'\s*CODE_SIGN_ENTITLEMENTS = [^;]+;', '', b)
              b = re.sub(r'\s*"?CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]"? = [^;]+;', '', b)
              add = ('\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
                     '\n\t\t\t\tDEVELOPMENT_TEAM = %s;'
                     '\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";'
                     '\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;'
                     '\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "%s";') % (
                  os.environ['PROFILE_TEAM'], os.environ['PROFILE_NAME'], os.environ['SIGN_IDENTITY'])
              return b.replace('buildSettings = {', 'buildSettings = {' + add, 1)
          s, n = re.subn(r'buildSettings = \{.*?\n\t\t\t\};', patch, s, flags=re.S)
          open(p, 'w', encoding='utf-8').write(s)
          print('patched blocks scanned:', n)
          PY
          grep -c "PROVISIONING_PROFILE_SPECIFIER" ios/Runner.xcodeproj/project.pbxproj
          python3 - <<'PY'
          import os, plistlib
          opts = {
              'method': os.environ['EXPORT_METHOD'],
              'teamID': os.environ['PROFILE_TEAM'],
              'signingStyle': 'manual',
              'signingCertificate': os.environ['SIGN_IDENTITY'],
              'provisioningProfiles': {os.environ['BUNDLE_ID']: os.environ['PROFILE_NAME']},
              'uploadSymbols': True,
              'compileBitcode': False,
          }
          plistlib.dump(opts, open('ios/ExportOptions.plist', 'wb'))
          print(opts)
          PY

      - name: Build signed IPA
        if: steps.sign.outputs.signed == 'true'
        run: |
          flutter build ipa --release --build-number=${{ github.run_number }} --export-options-plist=ios/ExportOptions.plist
          ls -la build/ios/ipa
          cp build/ios/ipa/*.ipa bainatna-ios.ipa

      # ---------------- مسار بدون توقيع ----------------
      - name: Build unsigned IPA
        if: steps.sign.outputs.signed != 'true'
        run: |
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          APP=build/ios/iphoneos/Runner.app
          ls -la "$APP" | head -n 5
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry bainatna-ios-unsigned.ipa Payload
          ls -la bainatna-ios-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Upload IPA as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: bainatna-ios
          path: |
            bainatna-ios.ipa
            bainatna-ios-unsigned.ipa
          if-no-files-found: error

      - name: Publish as a pre-release (never touches the Android releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: iOS ${{ github.run_number }} (${{ steps.sign.outputs.signed == 'true' && 'signed' || 'unsigned' }})
          body: "نسخة الآيفون (رقم ${{ github.run_number }}). ${{ steps.sign.outputs.signed == 'true' && 'موقّعة.' || 'غير موقّعة: للتثبيت عبر Sideloadly أو AltStore.' }} مو تحديث لنسخة الأندرويد."
          prerelease: true
          make_latest: 'false'
          files: |
            bainatna-ios.ipa
            bainatna-ios-unsigned.ipa
          fail_on_unmatched_files: false

      # ---------------- فحص تشغيل على محاكي (ما يعطّل النشر لو فشل) ----------------
      - name: Smoke test on the iOS simulator
        continue-on-error: true
        run: |
          flutter build ios --simulator --debug --no-codesign
          DEV=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEV" "$BUNDLE_ID"
          sleep 30
          xcrun simctl spawn "$DEV" launchctl list | grep "$BUNDLE_ID" || { echo "APP IS NOT RUNNING (crashed?)"; xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "Runner"' | tail -n 60; exit 1; }
          xcrun simctl io "$DEV" screenshot smoke.png
          ls -la smoke.png

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: smoke.png
          if-no-files-found: ignore
