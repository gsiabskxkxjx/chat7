name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android folder
        run: flutter create --platforms=android --project-name secure_chat .

      - name: Android permissions and minSdk
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = s.replace('android:label="secure_chat"', 'android:label="بيناتنا"')
          perms = '''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>
          '''
          if '<application' not in s:
              raise SystemExit('ERROR: no <application> tag in AndroidManifest.xml')
          s = s.replace('<application', perms + '    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 24)/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 24)/' android/app/build.gradle
          fi
          grep -n "minSdk" android/app/build.gradle* || true
          grep -c "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Firebase config (Android)
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/firebase_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="google_app_id" translatable="false">1:962048145242:android:c5b4f4b21234011b9d6563</string>
              <string name="gcm_defaultSenderId" translatable="false">962048145242</string>
              <string name="google_api_key" translatable="false">AIzaSyD5DhhnBllDG4hc9hyrbtrjGkZyeBokyCo</string>
              <string name="google_crash_reporting_api_key" translatable="false">AIzaSyD5DhhnBllDG4hc9hyrbtrjGkZyeBokyCo</string>
              <string name="project_id" translatable="false">benatna</string>
          </resources>
          XML
          grep -c "google_app_id" android/app/src/main/res/values/firebase_config.xml

      - name: Notification channels (Android)
        run: |
          F=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          if [ -z "$F" ] || ! grep -q "FlutterActivity" "$F"; then
            echo "WARNING: MainActivity.kt not found - skipping notification channels"
            exit 0
          fi
          PKG=$(grep -m1 '^package ' "$F")
          cat > "$F" <<KT
          $PKG

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      val messages = NotificationChannel("messages", "الرسائل", NotificationManager.IMPORTANCE_HIGH)
                      nm.createNotificationChannel(messages)
                      val calls = NotificationChannel("calls", "المكالمات", NotificationManager.IMPORTANCE_HIGH)
                      calls.enableVibration(true)
                      calls.vibrationPattern = longArrayOf(0, 700, 400, 700, 400, 700)
                      val attrs = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build()
                      calls.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE), attrs)
                      nm.createNotificationChannel(calls)
                  }
              }
          }
          KT
          echo "MainActivity.kt updated:"
          head -3 "$F"

      - name: App icon (Android)
        run: |
          if [ ! -f logo.png ]; then
            echo "logo.png not found in repo root - keeping the default icon"
            exit 0
          fi
          PYBIN=python3
          if ! $PYBIN -c "import PIL" 2>/dev/null; then
            pip install --quiet --break-system-packages pillow 2>/dev/null \
              || pip3 install --quiet --break-system-packages pillow 2>/dev/null \
              || { python3 -m venv /tmp/iconvenv && /tmp/iconvenv/bin/pip install --quiet pillow && PYBIN=/tmp/iconvenv/bin/python; } \
              || true
          fi
          "$PYBIN" - <<'PYEOF' || echo "WARNING: icon generation failed - keeping the default icon"
          import os
          from PIL import Image, ImageDraw

          im = Image.open('logo.png').convert('RGBA')
          w, h = im.size
          s = min(w, h)
          left, top = (w - s) // 2, (h - s) // 2
          im = im.crop((left, top, left + s, top + s))
          res = 'android/app/src/main/res'

          def put(img, path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path)

          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          adaptive = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          for d, n in legacy.items():
              ic = im.resize((n, n), Image.LANCZOS)
              mask = Image.new('L', (n, n), 0)
              ImageDraw.Draw(mask).rounded_rectangle((0, 0, n - 1, n - 1), radius=int(n * 0.22), fill=255)
              out = Image.new('RGBA', (n, n), (0, 0, 0, 0))
              out.paste(ic, (0, 0), mask)
              put(out, f'{res}/mipmap-{d}/ic_launcher.png')
          for d, n in adaptive.items():
              put(im.resize((n, n), Image.LANCZOS), f'{res}/mipmap-{d}/ic_launcher_foreground.png')

          r, g, b = im.resize((8, 8), Image.LANCZOS).convert('RGB').getpixel((0, 0))
          os.makedirs(f'{res}/values', exist_ok=True)
          with open(f'{res}/values/ic_launcher_background.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#%02X%02X%02X</color>\n</resources>\n' % (r, g, b))
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          with open(f'{res}/mipmap-anydpi-v26/ic_launcher.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n')
          print('icon generated from logo.png')
          PYEOF

      - name: Use fixed signing key
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "ERROR: missing secret KEYSTORE_PASSPHRASE (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          FILE=$(find . -maxdepth 1 -type f -name 'keystore_encrypted*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: keystore_encrypted.txt not found in the repo root. Upload it with Add file > Upload files."
            exit 1
          fi
          echo "Found: $FILE"
          echo "Passphrase length: ${#KEYSTORE_PASSPHRASE} (expected 24)"
          mkdir -p ~/.android
          if ! tr -d '[:space:]' < "$FILE" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -pass env:KEYSTORE_PASSPHRASE -out ~/.android/debug.keystore 2>/dev/null; then
            echo "ERROR: could not decrypt. Wrong passphrase, or the file was altered."
            exit 1
          fi
          if ! keytool -list -keystore ~/.android/debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "ERROR: the decrypted keystore is invalid. Wrong passphrase or damaged file."
            exit 1
          fi
          echo "Keystore OK"

      - run: flutter pub get

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
