name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android folder
        run: flutter create --platforms=android --project-name secure_chat .

      - name: Android permissions and minSdk
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = s.replace('android:label="secure_chat"', 'android:label="بيناتنا"')
          perms = '''    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW"/>
                      <data android:scheme="https"/>
                  </intent>
              </queries>
          '''
          if '<application' not in s:
              raise SystemExit('ERROR: no <application> tag in AndroidManifest.xml')
          s = s.replace('<application', perms + '    <application android:requestLegacyExternalStorage="true"', 1)
          # روابط الدعوة bainatna://join?c=XXXXXX (وإطفاء روابط فلاتر الافتراضية حتى ما تتعارض)
          deep = '''
                      <meta-data android:name="flutter_deeplinking_enabled" android:value="false" />
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="bainatna" android:host="join"/>
                      </intent-filter>
                  </activity>'''
          if '</activity>' not in s:
              raise SystemExit('ERROR: no </activity> in AndroidManifest.xml')
          s = s.replace('</activity>', deep, 1)
          # نافذة عائمة لمكالمة الفيديو
          if 'android:name=".MainActivity"' in s and 'supportsPictureInPicture' not in s:
              s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:supportsPictureInPicture="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 24)/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 24)/' android/app/build.gradle
          fi
          grep -n "minSdk" android/app/build.gradle* || true
          grep -c "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Core library desugaring (for local notifications)
        run: |
          F=android/app/build.gradle.kts
          if [ -f "$F" ]; then
            if grep -q "compileOptions {" "$F"; then
              sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$F"
            else
              sed -i 's/^android {/android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }/' "$F"
            fi
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n' >> "$F"
          else
            F=android/app/build.gradle
            if grep -q "compileOptions {" "$F"; then
              sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' "$F"
            else
              sed -i 's/^android {/android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }/' "$F"
            fi
            printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n' >> "$F"
          fi
          grep -n "desugar" "$F"

      - name: Package id and SDK levels (Android)
        run: |
          F=android/app/build.gradle.kts
          if [ -f "$F" ]; then
            sed -i -E 's/applicationId = "[^"]*"/applicationId = "com.bainatna.chat"/' "$F"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = maxOf(flutter.targetSdkVersion, 36)/' "$F"
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = maxOf(flutter.compileSdkVersion, 36)/' "$F"
          else
            F=android/app/build.gradle
            sed -i -E 's/applicationId[ =]+"[^"]*"/applicationId "com.bainatna.chat"/' "$F"
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion Math.max(flutter.targetSdkVersion, 36)/' "$F"
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion Math.max(flutter.compileSdkVersion, 36)/' "$F"
          fi
          grep -nE "applicationId|targetSdk|compileSdk|minSdk" "$F"
          if ! grep -q 'com.bainatna.chat' "$F"; then
            echo "ERROR: could not set applicationId to com.bainatna.chat in $F"
            exit 1
          fi

      - name: Skip release lint (avoids a lint crash in plugin sources)
        run: |
          python3 - <<'PY'
          import os
          kts = 'android/app/build.gradle.kts'
          p = kts if os.path.exists(kts) else 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          if kts == p:
              block = 'android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n'
          else:
              block = 'android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n'
          if 'checkReleaseBuilds' not in s:
              if '\nandroid {\n' not in s:
                  raise SystemExit('ERROR: no android { block in ' + p)
              s = s.replace('\nandroid {\n', '\n' + block, 1)
              open(p, 'w', encoding='utf-8').write(s)
          print(p)
          PY
          grep -n -A3 "lint {" android/app/build.gradle* || true

      - name: Firebase config (Android)
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/firebase_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="google_app_id" translatable="false">1:962048145242:android:064285c446fd1ce29d6563</string>
              <string name="gcm_defaultSenderId" translatable="false">962048145242</string>
              <string name="google_api_key" translatable="false">AIzaSyD5DhhnBllDG4hc9hyrbtrjGkZyeBokyCo</string>
              <string name="google_crash_reporting_api_key" translatable="false">AIzaSyD5DhhnBllDG4hc9hyrbtrjGkZyeBokyCo</string>
              <string name="project_id" translatable="false">benatna</string>
          </resources>
          XML
          grep -c "google_app_id" android/app/src/main/res/values/firebase_config.xml

      - name: Notification channels (Android)
        run: |
          F=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          if [ -z "$F" ] || ! grep -q "FlutterActivity" "$F"; then
            echo "WARNING: MainActivity.kt not found - skipping notification channels"
            exit 0
          fi
          PKG=$(grep -m1 '^package ' "$F")
          cat > "$F" <<KT
          $PKG

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.app.PictureInPictureParams
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.res.Configuration
          import android.os.Build
          import android.os.Bundle
          import android.util.Rational
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterFragmentActivity() {
              private var pipAllowed = false
              private var pipChannel: MethodChannel? = null

              // مكالمة فيديو شغالة وطلعت من التطبيق: نصغّرها لنافذة عائمة
              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (pipAllowed && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          enterPictureInPictureMode(
                              PictureInPictureParams.Builder().setAspectRatio(Rational(9, 16)).build()
                          )
                      } catch (e: Exception) {}
                  }
              }

              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  pipChannel?.invokeMethod("pip", isInPictureInPictureMode)
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val pip = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "bainatna/pip")
                  pipChannel = pip
                  pip.setMethodCallHandler { call, result ->
                      if (call.method == "enable") {
                          pipAllowed = call.arguments == true
                          result.success(null)
                      } else {
                          result.notImplemented()
                      }
                  }
                  // ضغط الفيديو قبل الإرسال
                  val compressor = VideoCompressor(this)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "bainatna/media").setMethodCallHandler { call, result ->
                      if (call.method == "compress") {
                          compressor.compress(call.argument<String>("in") ?: "", call.argument<String>("out") ?: "", result)
                      } else if (call.method == "cancel") {
                          compressor.cancel()
                          result.success(null)
                      } else {
                          result.notImplemented()
                      }
                  }
                  // تبديل أيقونة التطبيق
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "bainatna/icon").setMethodCallHandler { call, result ->
                      if (call.method == "get") {
                          result.success(IconSwitcher.state(this))
                      } else if (call.method == "set") {
                          result.success(IconSwitcher.set(this, call.argument<String>("name") ?: ""))
                      } else {
                          result.notImplemented()
                      }
                  }
                  // تحديث ويدجت الشاشة الرئيسية لما التطبيق يكتب بيانات جديدة
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "bainatna/widgets").setMethodCallHandler { call, result ->
                      if (call.method == "refresh") {
                          for (name in listOf("com.bainatna.chat.DaysWidget", "com.bainatna.chat.PhotoWidget")) {
                              try {
                                  val cn = ComponentName(packageName, name)
                                  val ids = AppWidgetManager.getInstance(this).getAppWidgetIds(cn)
                                  if (ids.isNotEmpty()) {
                                      val i = Intent(AppWidgetManager.ACTION_APPWIDGET_UPDATE)
                                      i.component = cn
                                      i.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, ids)
                                      sendBroadcast(i)
                                  }
                              } catch (e: Exception) {}
                          }
                          result.success(null)
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      val messages = NotificationChannel("messages", "الرسائل", NotificationManager.IMPORTANCE_HIGH)
                      nm.createNotificationChannel(messages)
                      val calls = NotificationChannel("calls", "المكالمات", NotificationManager.IMPORTANCE_HIGH)
                      calls.enableVibration(true)
                      calls.vibrationPattern = longArrayOf(0, 700, 400, 700, 400, 700)
                      val attrs = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build()
                      calls.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE), attrs)
                      nm.createNotificationChannel(calls)
                  }
              }
          }
          KT
          echo "MainActivity.kt updated:"
          head -3 "$F"

      - name: Home screen widgets (Android)
        run: |
          F=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          if [ -z "$F" ]; then echo "WARNING: no MainActivity.kt - skipping widgets"; exit 0; fi
          PKG=$(grep -m1 '^package ' "$F" | sed -E 's/^package +//; s/;//')
          NS=$(grep -hoE 'namespace *=? *"[^"]+"' android/app/build.gradle* | head -n 1 | sed -E 's/.*"([^"]+)"/\1/')
          [ -z "$NS" ] && NS="$PKG"
          echo "activity package: $PKG, namespace: $NS"
          RES=android/app/src/main/res
          D=android/app/src/main/kotlin/com/bainatna/chat
          mkdir -p "$D" "$RES/layout" "$RES/xml" "$RES/drawable"
          cat > "$D/BainatnaWidgets.kt" <<KT
          package com.bainatna.chat

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.graphics.BitmapFactory
          import android.view.View
          import android.widget.RemoteViews
          import java.io.File
          import java.util.TimeZone
          import org.json.JSONObject
          import ${NS}.R
          import ${PKG}.MainActivity

          private fun widgetData(context: Context): JSONObject =
              try { JSONObject(File(context.filesDir, "widget.json").readText()) } catch (e: Exception) { JSONObject() }

          private fun openApp(context: Context): PendingIntent {
              val i = Intent(context, MainActivity::class.java)
              i.flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
              return PendingIntent.getActivity(context, 0, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
          }

          class DaysWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  val d = widgetData(context)
                  val start = d.optString("start_ms", "").toLongOrNull()
                  val now = System.currentTimeMillis()
                  val tz = TimeZone.getDefault()
                  val day = 86400000L
                  val days = if (start == null) null else ((now + tz.getOffset(now)) / day - (start + tz.getOffset(start)) / day + 1)
                  for (id in ids) {
                      val v = RemoteViews(context.packageName, R.layout.bainatna_days_widget)
                      v.setTextViewText(R.id.w_days, days?.toString() ?: "♡")
                      v.setTextViewText(R.id.w_label, if (days == null) "افتح بيناتنا" else "يوم سوا")
                      v.setTextViewText(R.id.w_name, if (d.isNull("partner")) "" else d.optString("partner", ""))
                      v.setTextViewText(R.id.w_think, if (d.isNull("think")) "" else d.optString("think", ""))
                      v.setOnClickPendingIntent(R.id.w_root, openApp(context))
                      manager.updateAppWidget(id, v)
                  }
              }
          }

          class PhotoWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  val d = widgetData(context)
                  val path = if (d.isNull("photo")) null else d.optString("photo", "")
                  for (id in ids) {
                      val v = RemoteViews(context.packageName, R.layout.bainatna_photo_widget)
                      var shown = false
                      if (!path.isNullOrEmpty() && File(path).exists()) {
                          try {
                              val o = BitmapFactory.Options()
                              o.inJustDecodeBounds = true
                              BitmapFactory.decodeFile(path, o)
                              var s = 1
                              while (o.outWidth / s > 700 || o.outHeight / s > 700) s *= 2
                              val o2 = BitmapFactory.Options()
                              o2.inSampleSize = s
                              val bmp = BitmapFactory.decodeFile(path, o2)
                              if (bmp != null) {
                                  v.setImageViewBitmap(R.id.w_photo, bmp)
                                  shown = true
                              }
                          } catch (e: Exception) {}
                      }
                      v.setViewVisibility(R.id.w_empty, if (shown) View.GONE else View.VISIBLE)
                      v.setOnClickPendingIntent(R.id.w_root, openApp(context))
                      manager.updateAppWidget(id, v)
                  }
              }
          }
          KT
          cat > "$RES/drawable/bainatna_widget_bg.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#FFFF5FA2" android:centerColor="#FF7B5CFA" android:endColor="#FF0A84FF" android:angle="315"/>
              <corners android:radius="26dp"/>
          </shape>
          XML
          cat > "$RES/layout/bainatna_days_widget.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bainatna_widget_bg"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="12dp">
              <TextView android:id="@+id/w_name" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#E6FFFFFF" android:textSize="13sp" android:maxLines="1" android:ellipsize="end"/>
              <TextView android:id="@+id/w_days" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#FFFFFFFF" android:textSize="40sp" android:textStyle="bold" android:text="♡"/>
              <TextView android:id="@+id/w_label" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#E6FFFFFF" android:textSize="13sp" android:text="بيناتنا"/>
              <TextView android:id="@+id/w_think" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_marginTop="4dp" android:textColor="#FFFFFFFF" android:textSize="11sp" android:maxLines="2"
                  android:gravity="center"/>
          </LinearLayout>
          XML
          cat > "$RES/layout/bainatna_photo_widget.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bainatna_widget_bg"
              android:padding="4dp">
              <ImageView android:id="@+id/w_photo" android:layout_width="match_parent" android:layout_height="match_parent"
                  android:scaleType="centerCrop" android:contentDescription="ذكرى"/>
              <TextView android:id="@+id/w_empty" android:layout_width="match_parent" android:layout_height="match_parent"
                  android:gravity="center" android:textColor="#FFFFFFFF" android:textSize="14sp" android:text="صوركم تطلع هنا 📷"/>
          </FrameLayout>
          XML
          cat > "$RES/xml/bainatna_days_info.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp" android:minHeight="110dp"
              android:targetCellWidth="2" android:targetCellHeight="2"
              android:updatePeriodMillis="3600000"
              android:initialLayout="@layout/bainatna_days_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          XML
          cat > "$RES/xml/bainatna_photo_info.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp" android:minHeight="110dp"
              android:targetCellWidth="2" android:targetCellHeight="2"
              android:updatePeriodMillis="21600000"
              android:initialLayout="@layout/bainatna_photo_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          XML
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          rec = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
                  <receiver android:name="com.bainatna.chat.DaysWidget" android:exported="true" android:label="عدّاد أيامنا">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/bainatna_days_info"/>
                  </receiver>
                  <receiver android:name="com.bainatna.chat.PhotoWidget" android:exported="true" android:label="صورة من ذكرياتنا">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/bainatna_photo_info"/>
                  </receiver>
              </application>'''
          if '</application>' not in s:
              raise SystemExit('ERROR: no </application> in AndroidManifest.xml')
          s = s.replace('</application>', rec, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('widgets added to manifest')
          PY
          ls -la "$D"

      - name: App icon (Android)
        run: |
          if [ ! -f logo.png ]; then
            echo "logo.png not found in repo root - keeping the default icon"
            exit 0
          fi
          PYBIN=python3
          if ! $PYBIN -c "import PIL" 2>/dev/null; then
            pip install --quiet --break-system-packages pillow 2>/dev/null \
              || pip3 install --quiet --break-system-packages pillow 2>/dev/null \
              || { python3 -m venv /tmp/iconvenv && /tmp/iconvenv/bin/pip install --quiet pillow && PYBIN=/tmp/iconvenv/bin/python; } \
              || true
          fi
          "$PYBIN" - <<'PYEOF' || echo "WARNING: icon generation failed - keeping the default icon"
          import os
          from PIL import Image, ImageDraw

          im = Image.open('logo.png').convert('RGBA')
          w, h = im.size
          s = min(w, h)
          left, top = (w - s) // 2, (h - s) // 2
          im = im.crop((left, top, left + s, top + s))
          res = 'android/app/src/main/res'

          def put(img, path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img.save(path)

          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          adaptive = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          for d, n in legacy.items():
              ic = im.resize((n, n), Image.LANCZOS)
              mask = Image.new('L', (n, n), 0)
              ImageDraw.Draw(mask).rounded_rectangle((0, 0, n - 1, n - 1), radius=int(n * 0.22), fill=255)
              out = Image.new('RGBA', (n, n), (0, 0, 0, 0))
              out.paste(ic, (0, 0), mask)
              put(out, f'{res}/mipmap-{d}/ic_launcher.png')
          for d, n in adaptive.items():
              put(im.resize((n, n), Image.LANCZOS), f'{res}/mipmap-{d}/ic_launcher_foreground.png')
              # أيقونة أحادية اللون (ثيمات أندرويد 13+): الأجزاء الفاتحة بس، وبهامش أكبر
              g = im.resize((n, n), Image.LANCZOS).convert('L')
              alpha = g.point(lambda v: max(0, min(255, (v - 150) * 4)))
              mono = Image.new('RGBA', (n, n), (255, 255, 255, 0))
              mono.putalpha(alpha)
              inner = int(n * 0.98)
              mono = mono.resize((inner, inner), Image.LANCZOS)
              canvas = Image.new('RGBA', (n, n), (255, 255, 255, 0))
              canvas.paste(mono, ((n - inner) // 2, (n - inner) // 2), mono)
              put(canvas, f'{res}/mipmap-{d}/ic_launcher_monochrome.png')

          r, g, b = im.resize((8, 8), Image.LANCZOS).convert('RGB').getpixel((0, 0))
          os.makedirs(f'{res}/values', exist_ok=True)
          with open(f'{res}/values/ic_launcher_background.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#%02X%02X%02X</color>\n</resources>\n' % (r, g, b))
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          with open(f'{res}/mipmap-anydpi-v26/ic_launcher.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n    <monochrome android:drawable="@mipmap/ic_launcher_monochrome"/>\n</adaptive-icon>\n')
          print('icon generated from logo.png')
          PYEOF

      - name: Video compression and alternate icons (Android)
        run: |
          F=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          if [ -z "$F" ] || ! grep -q "bainatna/media" "$F"; then
            echo "WARNING: MainActivity.kt was not rewritten - skipping compression and alternate icons"
            exit 0
          fi
          PKG=$(grep -m1 '^package ' "$F" | sed -E 's/^package +//; s/;//')
          D=$(dirname "$F")
          for K in VideoCompressor IconSwitcher; do
            sed "s/^package .*/package ${PKG}/" ".github/android/$K.kt" > "$D/$K.kt"
          done
          G=android/app/build.gradle.kts
          if [ -f "$G" ]; then
            printf '\ndependencies {\n    implementation("androidx.media3:media3-transformer:1.5.1")\n    implementation("androidx.media3:media3-effect:1.5.1")\n    implementation("androidx.media3:media3-common:1.5.1")\n}\n' >> "$G"
          else
            G=android/app/build.gradle
            printf '\ndependencies {\n    implementation "androidx.media3:media3-transformer:1.5.1"\n    implementation "androidx.media3:media3-effect:1.5.1"\n    implementation "androidx.media3:media3-common:1.5.1"\n}\n' >> "$G"
          fi
          grep -n "media3" "$G"
          PYBIN=python3
          if ! $PYBIN -c "import PIL" 2>/dev/null; then
            pip install --quiet --break-system-packages pillow 2>/dev/null \
              || pip3 install --quiet --break-system-packages pillow 2>/dev/null \
              || { python3 -m venv /tmp/iconvenv2 && /tmp/iconvenv2/bin/pip install --quiet pillow && PYBIN=/tmp/iconvenv2/bin/python; } \
              || true
          fi
          "$PYBIN" .github/scripts/alt_icons.py || echo "WARNING: alternate icons failed - the main icon is unchanged"
          grep -c "activity-alias" android/app/src/main/AndroidManifest.xml || true

      - name: Preinstall Android NDK (retries a bad download)
        run: |
          NDK=28.2.13676358
          SDKM=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          if [ -d "/usr/local/lib/android/sdk/ndk/$NDK" ]; then echo "NDK $NDK already installed"; exit 0; fi
          for i in 1 2 3; do
            if yes | "$SDKM" --install "ndk;$NDK" > /tmp/ndk.log 2>&1; then echo "NDK $NDK installed"; exit 0; fi
            echo "NDK download failed (try $i), retrying..."; tail -3 /tmp/ndk.log
            rm -rf "/usr/local/lib/android/sdk/ndk/$NDK" /usr/local/lib/android/sdk/.temp 2>/dev/null || true
            sleep 10
          done
          echo "WARNING: could not preinstall NDK $NDK; the build will try again"

      - name: Use fixed signing key
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "ERROR: missing secret KEYSTORE_PASSPHRASE (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          FILE=$(find . -maxdepth 1 -type f -name 'upload_key_encrypted*' | head -n 1)
          if [ -z "$FILE" ]; then
            FILE=$(find . -maxdepth 1 -type f -name 'keystore_encrypted*' | head -n 1)
          fi
          if [ -z "$FILE" ]; then
            echo "ERROR: upload_key_encrypted.txt not found in the repo root. Upload it with Add file > Upload files."
            exit 1
          fi
          echo "Found: $FILE"
          echo "Passphrase length: ${#KEYSTORE_PASSPHRASE} (expected 24)"
          mkdir -p ~/.android
          if ! tr -d '[:space:]' < "$FILE" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -pass env:KEYSTORE_PASSPHRASE -out ~/.android/debug.keystore 2>/dev/null; then
            echo "ERROR: could not decrypt. Wrong passphrase, or the file was altered."
            exit 1
          fi
          if ! keytool -list -keystore ~/.android/debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "ERROR: the decrypted keystore is invalid. Wrong passphrase or damaged file."
            exit 1
          fi
          echo "Keystore OK"
          OWNER=$(keytool -list -v -keystore ~/.android/debug.keystore -storetype PKCS12 -storepass android 2>/dev/null | grep -m1 "Owner:")
          echo "$OWNER"
          if echo "$OWNER" | grep -q "Android Debug"; then
            echo "WARNING: this is still the old key named Android Debug - Google Play will reject it. Upload upload_key_encrypted.txt."
          fi

      - run: flutter pub get

      - name: Analyze (errors only, does not stop the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib 2>&1 | grep -E "(error|warning) •" || echo "no analyzer errors or warnings in lib"

      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NO=${{ github.run_number }} --dart-define=SIDELOAD=true

      - name: Safety check - the APK must have a launcher icon
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)
          "${BT}aapt" dump badging "$APK" | grep -E "launchable-activity|application-icon-640" | head -n 4 || true
          "${BT}aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest_tree.txt
          echo "=== activities and aliases ==="
          grep -nE "E: activity|E: activity-alias|android:name\(0x01010003\)=\"com.bainatna.chat.Icon|android:enabled|category.LAUNCHER|action.MAIN" /tmp/manifest_tree.txt | head -n 60 || true
          HAS_LAUNCHER=0
          grep -q "android.intent.category.LAUNCHER" /tmp/manifest_tree.txt && HAS_LAUNCHER=1
          if [ "$HAS_LAUNCHER" != "1" ]; then
            echo "ERROR: no launcher entry in the APK manifest - the app would not show on the home screen"
            exit 1
          fi
          echo "launcher entry present"

      - name: Build App Bundle (for Google Play)
        continue-on-error: true
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=BUILD_NO=${{ github.run_number }}

      - name: Show package, target SDK and signing certificate
        continue-on-error: true
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)
          echo "=== APK file ==="
          ls -la "$APK"
          echo "=== package / sdk levels / ABIs ==="
          "${BT}aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code" || true
          echo "=== signature (must say Verifies + v2 true) ==="
          "${BT}apksigner" verify --verbose --print-certs "$APK" 2>&1 | head -n 14 || true
          echo "=== zip alignment (must say Verification succesful) ==="
          "${BT}zipalign" -c -v 4 "$APK" 2>&1 | tail -n 2 || true
          echo "=== bundle ==="
          ls -la build/app/outputs/bundle/release/ 2>/dev/null || echo "no AAB produced"

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
