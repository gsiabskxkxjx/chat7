name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android folder
        run: flutter create --platforms=android --project-name secure_chat .

      - name: Allow internet access
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Use fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing secret DEBUG_KEYSTORE_B64"
            exit 1
          fi
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          echo "Secret length: ${#CLEAN} (expected 3556)"
          mkdir -p ~/.android
          if ! printf '%s' "$CLEAN" | base64 -d > ~/.android/debug.keystore 2>/dev/null; then
            echo "ERROR: the secret is not valid base64. Re-copy the WHOLE text of new_signing_key_secret.txt."
            exit 1
          fi
          if ! keytool -list -keystore ~/.android/debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "ERROR: the keystore is damaged or incomplete. Re-copy the WHOLE text."
            exit 1
          fi
          echo "Keystore OK"

      - run: flutter pub get

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
